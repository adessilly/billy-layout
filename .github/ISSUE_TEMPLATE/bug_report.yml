name: Bug report
description: Something in billy-layout does not work as documented
labels: [bug]
body:
  - type: input
    id: component
    attributes:
      label: Component
      description: Which component/service is affected? (e.g. billy-datepicker, ToastrService)
      placeholder: billy-datepicker
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happens, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Steps or a snippet reproducing the issue (a StackBlitz link is ideal).
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: billy-layout / Angular / browser
      placeholder: billy-layout 1.0.0, Angular 22.0, Chrome 138
    validations:
      required: true
