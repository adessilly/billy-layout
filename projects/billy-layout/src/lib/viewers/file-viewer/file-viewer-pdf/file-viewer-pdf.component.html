@let fichierTpl = fichier();
@if (visible() && urlObject && fichierTpl) {
  <div class="viewer">
    <billy-file-viewer-toolbar [loading]="loading()" [filename]="fichierTpl.fileName" icon="fa-solid fa-file-pdf" (closeViewer)="hide()">
      <ng-container *ngTemplateOutlet="toolbarButtonsNav"></ng-container>
      <ng-container *ngTemplateOutlet="toolbarButtonsZoom"></ng-container>
    </billy-file-viewer-toolbar>
    <div class="viewer-body">
      <pdf-viewer
        [style]="'height: '+pdfViewerHeight+'px;'"
        [page]="currentPage + 1"
        [zoom]="zoom"
        [src]="urlObject"
        [show-all]="false"
        [original-size]="false"
        (page-rendered)="pageRendered($event)"
        (after-load-complete)="pdfLoaded($event)"
        (on-progress)="pdfLoading($event)">
      </pdf-viewer>
    </div>
    <ng-template #toolbarButtonsNav>
      @if (totalPages > 1) {
        <div class="viewer-group">
          <button [disabled]="btnPrevDisabled" type="button" class="viewer-btn" title="Page précédente" (click)="prevPage()">
            <i class="fa-solid fa-chevron-left"></i>
          </button>
          <span class="viewer-page-indicator">{{ currentPage+1 }} / {{ totalPages }}</span>
          <button [disabled]="btnNextDisabled" type="button" class="viewer-btn" title="Page suivante" (click)="nextPage()">
            <i class="fa-solid fa-chevron-right"></i>
          </button>
        </div>
      }
    </ng-template>
    <ng-template #toolbarButtonsZoom>
      <div class="viewer-group">
        <button [disabled]="btnZoomOutDisabled" type="button" class="viewer-btn" title="Dézoomer" (click)="zoomOut()">
          <i class="fa-solid fa-magnifying-glass-minus"></i>
        </button>
        <button [disabled]="btnZoomInDisabled" type="button" class="viewer-btn" title="Zoomer" (click)="zoomIn()">
          <i class="fa-solid fa-magnifying-glass-plus"></i>
        </button>
      </div>
    </ng-template>
  </div>
}
