<svg [attr.width]="size()" [attr.height]="size()" viewBox="0 0 24 24" fill="none"
     stroke="currentColor" [attr.stroke-width]="strokeWidth()"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  @switch (name()) {
    @case ('home') {
      <path class="anim-lift" d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/>
    }
    @case ('purchases') {
      <g class="anim-drop"><path d="M12 3v11"/><path d="m7 10 5 5 5-5"/></g><path d="M4 20h16"/>
    }
    @case ('quotes') {
      <rect x="5" y="3" width="14" height="18" rx="2"/><path class="anim-draw anim-draw-16" d="M9 8h6M9 12h6M9 16h4"/>
    }
    @case ('sales') {
      <g class="anim-rise"><path d="M12 21V10"/><path d="m7 14 5-5 5 5"/></g><path d="M4 4h16"/>
    }
    @case ('services') {
      <rect x="4" y="4" width="16" height="16" rx="3"/><path class="anim-draw anim-draw-11" d="m8.5 12 2.5 2.5 4.5-5"/>
    }
    @case ('calendar') {
      <rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 9h16"/><path class="anim-lift" d="M8 3v4M16 3v4"/>
    }
    @case ('clients') {
      <circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path class="anim-greet" d="M17 6a3 3 0 0 1 0 6"/>
    }
    @case ('account') {
      <circle cx="12" cy="8" r="3.5"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/>
    }
    @case ('peppol') {
      <circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c3 3.5 3 14 0 18M12 3c-3 3.5-3 14 0 18"/>
    }
    @case ('bell') {
      <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6Z"/><path d="M10 20a2 2 0 0 0 4 0"/>
    }
    @case ('chevron-left') {
      <path d="m15 6-6 6 6 6"/>
    }
    @case ('chevron-right') {
      <path d="m9 6 6 6-6 6"/>
    }
    @case ('chevron-down') {
      <path d="m6 9 6 6 6-6"/>
    }
    @case ('sync') {
      <path d="M4 12a8 8 0 0 1 13-6l3 3M20 12a8 8 0 0 1-13 6l-3-3"/><path d="M20 4v5h-5M4 20v-5h5"/>
    }
    @case ('check') {
      <path d="m5 12 5 5 9-11"/>
    }
    @case ('clock') {
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>
    }
    @case ('search') {
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    }
    @case ('dark-mode') {
      <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor"/>
    }
    @case ('logout') {
      <path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 8l4 4-4 4M20 12H9"/>
    }
    @case ('open') {
      <path d="M14 3h7v7"/><path d="M10 14 21 3"/><path d="M21 14v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5"/>
    }
    @case ('upload') {
      <path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
    }
    @case ('plus') {
      <path d="M12 5v14M5 12h14"/>
    }
    @case ('close') {
      <path d="M6 6l12 12M18 6 6 18"/>
    }
    @case ('refresh') {
      <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>
    }
    @case ('bolt') {
      <path d="M13 2 5 13h5l-1 9 8-11h-5l1-9Z"/>
    }
    @case ('lock') {
      <rect x="4" y="10.5" width="16" height="10" rx="3"/><path d="M8 10.5V7.75a4 4 0 0 1 8 0v2.75"/><circle cx="12" cy="15.5" r="1.4" fill="currentColor" stroke="none"/>
    }
    @case ('eye') {
      <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/>
    }
    @case ('eye-off') {
      <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/><path d="m4 20 16-16"/>
    }
    @case ('stats') {
      <path d="M4 4v16h16"/><g class="anim-rise"><path d="M8 20v-5M12.5 20v-9M17 20v-13"/></g>
    }
    @case ('chart') {
      <path d="M4 4v16h16"/><path class="anim-draw anim-draw-19" d="m7 15 3.5-4 3 2.5L20 7"/><path d="M20 11V7h-4"/>
    }
    @case ('pie-chart') {
      <circle cx="12" cy="12" r="9"/><path class="anim-draw anim-draw-19" d="M21 12h-9V3"/>
    }
    @case ('send') {
      <rect x="3" y="5" width="18" height="14" rx="2"/><path class="anim-drop" d="m3.5 7.5 8.5 6 8.5-6"/>
    }
    @case ('trash') {
      <g class="anim-lift"><path d="M4 7h16"/><path d="M10 4h4"/></g><path d="M6 7v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7"/><path d="M10.5 11v6M13.5 11v6"/>
    }
    @case ('download') {
      <g class="anim-drop"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/></g><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
    }
    @case ('magic') {
      <path d="M3.5 20.5 13 11"/><path class="anim-greet" d="M17 3.5l1.2 3.3L21.5 8l-3.3 1.2L17 12.5l-1.2-3.3L12.5 8l3.3-1.2Z"/><path d="M6.3 4.8l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6Z"/>
    }
    @case ('file-text') {
      <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5Z"/><path d="M13.5 3v5.5H19"/><path class="anim-draw anim-draw-11" d="M8.5 13h7M8.5 17h4.5"/>
    }
    @case ('file-binary') {
      <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5Z"/><path d="M13.5 3v5.5H19"/><g class="anim-greet"><path d="M8 13.5h1.5v5"/><rect x="12.5" y="13.5" width="3.5" height="5" rx="1.75"/></g>
    }
    @case ('file-image') {
      <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5Z"/><path d="M13.5 3v5.5H19"/><circle class="anim-greet" cx="9.2" cy="11.8" r="1.15"/><path d="m7 18 3-3 2 1.5 2-2 2.5 3.5"/>
    }
    @case ('file-archive') {
      <path d="M13.5 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8.5Z"/><path d="M13.5 3v5.5H19"/><path class="anim-drop" d="M10.5 5.5V7M10.5 9V10.5M10.5 12.5V14"/><rect x="9" y="15.5" width="3" height="3.2" rx="1.1"/>
    }
    @case ('info') {
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><circle class="anim-greet" cx="12" cy="7.8" r="1.1" fill="currentColor" stroke="none"/>
    }
    @case ('warning') {
      <path d="M12 4 21.5 19.5H2.5Z"/><g class="anim-greet"><path d="M12 10v4"/><circle cx="12" cy="16.9" r="1.1" fill="currentColor" stroke="none"/></g>
    }
    @case ('error') {
      <circle cx="12" cy="12" r="9"/><path class="anim-greet" d="m9 9 6 6M15 9l-6 6"/>
    }
    @case ('bug') {
      <rect x="8" y="7" width="8" height="12" rx="4"/><path class="anim-greet" d="M10 7.4 8.5 4.5M14 7.4 15.5 4.5"/><path d="M8 11H4.5M8 15H4.5M16 11h3.5M16 15h3.5"/>
    }
    @case ('clipboard') {
      <path d="M9 4H7a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2"/><rect class="anim-lift" x="9" y="2.5" width="6" height="3.5" rx="1.2"/>
    }
    @case ('link') {
      <path class="anim-draw anim-draw-16" d="M10 13.5a4 4 0 0 0 5.7.3l3-3a4 4 0 0 0-5.7-5.7l-1.7 1.7"/><path class="anim-draw anim-draw-16" d="M14 10.5a4 4 0 0 0-5.7-.3l-3 3a4 4 0 0 0 5.7 5.7l1.7-1.7"/>
    }
  }
</svg>
