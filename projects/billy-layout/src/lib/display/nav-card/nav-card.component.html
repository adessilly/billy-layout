<span class="nc-icon">
  <billy-icon [name]="icon()" [size]="22" [strokeWidth]="1.8" />
</span>

<span class="nc-texts">
  <span class="nc-head">
    <span class="nc-label">{{ label() }}</span>
    @if (badge() !== null) {
      <span class="nc-badge">{{ badge() }}</span>
    }
  </span>
  @if (description()) {
    <span class="nc-description">{{ description() }}</span>
  }
</span>

@if (chevron()) {
  <billy-icon class="nc-chevron" aria-hidden="true" name="chevron-right" [size]="17" [strokeWidth]="2" />
}
