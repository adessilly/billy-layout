<header class="billy-page-header">

  @if (retourVisible()) {
    <button
      type="button"
      class="billy-page-header-back"
      [title]="retourTitre()"
      [attr.aria-label]="retourTitre()"
      (click)="retour.emit()">
      <i class="fa-solid fa-chevron-left"></i>
    </button>
  }

  <div class="billy-page-header-titles">
    <h1 class="billy-page-header-title">{{ titre() }}</h1>
    @if (sousTitre()) {
      <div class="billy-page-header-subtitle">{{ sousTitre() }}</div>
    }
  </div>

  <div class="zone-btn-header">
    <ng-content></ng-content>
  </div>

</header>
