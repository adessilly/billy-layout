<div class="toast-shell">
  <div class="toast-card toast-{{ toast().type }}"
       [class.expanded]="expanded()"
       role="alert"
       aria-atomic="true"
       (click)="toggleExpanded()">
    <span class="toast-accent" aria-hidden="true"></span>
    <div class="toast-icon" aria-hidden="true">
      <i class="{{ icone() }}"></i>
    </div>
    <div class="toast-texts">
      <div class="toast-title">{{ toast().titre }}</div>
      <div class="toast-message">{{ toast().message }}</div>
    </div>
    <button type="button" class="toast-close" aria-label="Fermer" (click)="close($event)">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div class="toast-progress"
         [style.animation-duration.ms]="toast().duration"
         (animationend)="close()"></div>
  </div>
</div>
