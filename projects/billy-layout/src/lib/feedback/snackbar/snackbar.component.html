<div class="pwa-snackbar-zone" [class.pwa-snackbar-zone-active]="visible()" role="alert" aria-live="polite">
    <div class="pwa-snackbar">
        <div class="pwa-snackbar__icon" aria-hidden="true">
            <i class="fa-solid fa-arrow-rotate-right"></i>
        </div>

        <!-- Layout desktop : message + bouton séparés -->
        <div class="pwa-snackbar__body">
            <p class="pwa-snackbar__message">{{ message() }}</p>
            <button class="pwa-snackbar__btn" (click)="askButtonClick()" [title]="buttonTitle()">
                <i class="fa-solid fa-bolt" aria-hidden="true"></i>
                {{ buttonLabel() }}
            </button>
        </div>

        <!-- Layout mobile : bouton unique fusionné -->
        <button class="pwa-snackbar__btn-compact" (click)="askButtonClick()" [title]="buttonTitle()">
            <i class="fa-solid fa-arrow-rotate-right" aria-hidden="true"></i>
            {{ message() }}
        </button>

        <button class="pwa-snackbar__close" (click)="askClose()" [title]="closeTitle()" aria-label="Ignorer">
            <i class="fa-solid fa-xmark" aria-hidden="true"></i>
        </button>
    </div>
</div>
