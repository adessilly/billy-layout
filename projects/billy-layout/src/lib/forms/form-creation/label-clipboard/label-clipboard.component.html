<span class="label-container" (click)="askCopy($event)" title="cliquez pour copier dans le presse papier">
  <div class="icon-zone">
    @if(copied()) {
      <i class="copied-icon fa-solid fa-clipboard-check"></i>
    }
    @else {
      <i class="copy-icon fa-solid fa-clipboard"></i>
    }
   </div>
  {{ label() }}
  @if(copied()) {
    <span>&nbsp;(copié dans le presse papier)</span>
  }
</span>
