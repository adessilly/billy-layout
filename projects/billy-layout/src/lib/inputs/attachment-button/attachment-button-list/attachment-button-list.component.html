<div class="attachment-list-panel">
  <div class="attachment-list-header">
    <span class="title">Pièces jointes ({{ files().length }}/{{ maxFiles() }})</span>
    <button type="button" class="abl-close" (click)="onClose()" title="Fermer">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="attachment-list-content">
    @for(file of files(); track file.name; let i = $index) {
      <div class="attachment-item">
        <i class="fa-solid fa-file-pdf abl-file-icon"></i>
        <span class="file-name" [title]="file.name">{{ file.name }}</span>
        <button
          type="button"
          class="btn-delete"
          (click)="onDeleteFile(i)"
          title="Supprimer ce fichier">
          <i class="fa-solid fa-trash"></i>
        </button>
      </div>
    }
  </div>

  @if(canAddMore) {
    <div class="attachment-list-footer">
      <button type="button" class="abl-add" (click)="onAddFiles()">
        <i class="fa-solid fa-plus"></i>
        Ajouter un fichier
      </button>
    </div>
  }
</div>
