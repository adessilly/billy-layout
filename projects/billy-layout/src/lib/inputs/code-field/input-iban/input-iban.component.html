@let details = info();

<div class="cfd-shell"
  [class.cfd-shell--focus]="focused()"
  [class.cfd-shell--valid]="status() === 'valid'"
  [class.cfd-shell--invalid]="showError()"
  [class.cfd-shell--disabled]="isDisabled()">

  <billy-code-glyph class="cfd-glyph" kind="iban"></billy-code-glyph>

  <input #codeInput class="cfd-input" type="text"
    [id]="inputId() || uid"
    [placeholder]="placeholder() || 'BE68 5390 0754 7034'"
    [disabled]="isDisabled()"
    [attr.aria-invalid]="showError()"
    [attr.aria-describedby]="uid + '-msg'"
    autocomplete="off" autocapitalize="characters" spellcheck="false"
    (input)="onInput()"
    (keydown)="onKeydown($event)"
    (focus)="onFocus()"
    (blur)="onBlur()" />

  <billy-code-status [status]="status()" [progress]="progress()"></billy-code-status>

</div>

<p class="cfd-meta" [id]="uid + '-msg'" role="status">
  @if (details.countryLabel) {
    <span class="cfd-country">{{ details.countryLabel }}</span>
  }
  <span class="cfd-msg"
    [class.cfd-msg--ok]="status() === 'valid'"
    [class.cfd-msg--info]="status() === 'unverified'"
    [class.cfd-msg--error]="showError()">{{ message() }}</span>
</p>
