<div class="cfd-shell"
  [class.cfd-shell--focus]="focused()"
  [class.cfd-shell--valid]="status() === 'valid'"
  [class.cfd-shell--invalid]="showError()"
  [class.cfd-shell--disabled]="isDisabled()">

  <billy-code-glyph class="cfd-glyph" kind="email"></billy-code-glyph>

  <!-- type="text" et non "email" : le socle place le curseur avec
       setSelectionRange(), que la norme n'autorise pas sur un champ email
       (il lève InvalidStateError, et la saisie serait perdue). `inputmode`
       ramène le clavier « @ » sur mobile, qui est ce qu'on cherchait. -->
  <input #codeInput class="cfd-input cfd-input--text" type="text" inputmode="email"
    [id]="inputId() || uid"
    [placeholder]="placeholder() || 'nom@exemple.be'"
    [disabled]="isDisabled()"
    [attr.aria-invalid]="showError()"
    [attr.aria-describedby]="uid + '-msg'"
    autocomplete="email" autocapitalize="off" spellcheck="false"
    (input)="onInput()"
    (keydown)="onKeydown($event)"
    (focus)="onFocus()"
    (blur)="onBlur()" />

  <billy-code-status [status]="status()" [progress]="progress()"></billy-code-status>

</div>

<p class="cfd-meta" [id]="uid + '-msg'" role="status">
  <!-- Pas de pastille de domaine sur une adresse en erreur : « gmail.com »
       affiché à côté de « il y a deux @ » brouille le message. -->
  @if (status() !== 'invalid' && domain(); as host) {
    <span class="cfd-country">{{ host }}</span>
  }

  @if (suggestion(); as corrected) {
    <!-- La correction est cliquable : la lire sans pouvoir l'appliquer serait
         une invitation à retaper l'adresse à la main. -->
    <button type="button" class="cfd-suggest" (click)="applySuggestion()">
      Vouliez-vous dire <strong>{{ corrected }}</strong> ?
    </button>
  } @else {
    <span class="cfd-msg"
      [class.cfd-msg--ok]="status() === 'valid'"
      [class.cfd-msg--error]="showError()">{{ message() }}</span>
  }
</p>
