@if (segments().length) {

  @if (glyph()) {
    <billy-code-glyph class="cv-glyph" [kind]="kind()"></billy-code-glyph>
  }

  <span class="cv-code">
    @for (segment of segments(); track $index) {
      <span class="cv-seg" [class.cv-seg--muted]="segment.muted">{{ segment.text }}</span>
    }
  </span>

  @if (copyable()) {
    <button type="button" class="cv-copy" [class.cv-copy--done]="copied()"
      [title]="copied() ? i18n.strings().codeDisplay.copied : i18n.strings().codeDisplay.copy + ' ' + raw()"
      [attr.aria-label]="copied() ? i18n.strings().codeDisplay.copied : i18n.strings().codeDisplay.copy + ' ' + raw()"
      (click)="askCopy()">
      @if (copied()) {
        <i class="fa-solid fa-check" aria-hidden="true"></i>
      } @else {
        <i class="fa-solid fa-copy" aria-hidden="true"></i>
      }
    </button>
  }

} @else {
  <span class="cv-empty">{{ emptyText() }}</span>
}
