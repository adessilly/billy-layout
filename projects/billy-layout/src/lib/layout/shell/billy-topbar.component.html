<header class="billy-topbar">

  <button class="billy-topbar-burger"
          type="button"
          [class.collapsed]="shell.sidebarCollapsed()"
          (click)="shell.toggleSidebar()"
          title="Replier / déplier le menu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a class="billy-topbar-logo" [routerLink]="homeLink" title="Accueil">
    <img src="assets/images/icon-384.png" alt="BILLy" />
  </a>

  <div class="billy-topbar-search">
    <ng-content select="[shell-search]" />
  </div>

  <ul class="billy-topbar-actions">

    <li class="nav-item billy-topbar-action btn-toggle-dark-mode">
      <a class="nav-link" (click)="toggleDarkMode()" title="Mode clair / sombre">
        <billy-icon name="dark-mode" [size]="19" [strokeWidth]="1.8" />
      </a>
    </li>

    <ng-content select="[shell-notifications]" />

    <li class="billy-topbar-divider" aria-hidden="true"></li>

    <ng-content select="[shell-account]" />

    <li class="nav-item billy-topbar-action">
      <a class="nav-link" (click)="logout()" title="Me déconnecter">
        <billy-icon name="logout" [size]="19" [strokeWidth]="1.8" />
      </a>
    </li>

  </ul>

</header>
