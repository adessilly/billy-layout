<header class="billy-topbar">

  <button class="billy-topbar-burger"
          type="button"
          [class.collapsed]="shell.sidebarCollapsed()"
          (click)="shell.toggleSidebar()"
          [title]="i18n.strings().topbar.toggleMenu">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <a class="billy-topbar-logo" [routerLink]="homeLink" [title]="i18n.strings().topbar.home">
    @if (logoTemplate(); as template) {
      <ng-container [ngTemplateOutlet]="template" />
    } @else {
      <!-- Plain <img>: the URL comes from the application (data URI allowed),
           which NgOptimizedImage does not support. -->
      <img [src]="logoSrc()" [alt]="logoAlt()" [class.custom]="hasCustomLogo()" />
    }
  </a>

  <div class="billy-topbar-search">
    <ng-content select="[shell-search]" />
  </div>

  <ul class="billy-topbar-actions">

    <li class="nav-item billy-topbar-action btn-toggle-dark-mode">
      <a class="nav-link" (click)="toggleDarkMode()" [title]="i18n.strings().topbar.darkMode">
        <billy-icon name="dark-mode" [size]="19" [strokeWidth]="1.8" />
      </a>
    </li>

    <ng-content select="[shell-notifications]" />

    <li class="billy-topbar-divider" aria-hidden="true"></li>

    <ng-content select="[shell-account]" />

    <li class="nav-item billy-topbar-action">
      <a class="nav-link" (click)="logout()" [title]="i18n.strings().topbar.logout">
        <billy-icon name="logout" [size]="19" [strokeWidth]="1.8" />
      </a>
    </li>

  </ul>

</header>
