<div class="billy-shell">

  <billy-topbar>
    <!-- Re-projection des slots métier vers la topbar (ng-container : un
         <ng-content select> re-projeté ne matche pas sans ngProjectAs). -->
    <ng-container ngProjectAs="[shell-search]">
      <ng-content select="[shell-search]" />
    </ng-container>
    <ng-container ngProjectAs="[shell-notifications]">
      <ng-content select="[shell-notifications]" />
    </ng-container>
    <ng-container ngProjectAs="[shell-account]">
      <ng-content select="[shell-account]" />
    </ng-container>
  </billy-topbar>

  <div class="billy-shell-body">

    <billy-sidebar />

    @if (shell.mobileSidebarOpen()) {
      <div class="billy-shell-backdrop" (click)="shell.closeMobileSidebar()"></div>
    }

    <main class="billy-shell-content">
      <ng-content />
    </main>

  </div>

</div>
